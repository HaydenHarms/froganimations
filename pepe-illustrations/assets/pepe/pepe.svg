<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 480" width="300" height="480">
  <title>Pepe, base pose (standing)</title>
  <!--
    Modular base asset for the pepe-illustrations skill. See references/pepe-ip.md.
    Coordinate anchors (in this 300x480 space):
      feet on the ground ...... y = 462, centred on x = 150
      bottom of body (sit) .... y = 388
      left shoulder ........... (98, 168)    right shoulder ... (202, 168)
      neck / head base ........ y = 140
    In a 1600x900 scene, place him with
      <g transform="translate(X,Y) scale(0.55)"> ... </g>
    where (X,Y) is where the top-left of this 300x480 box should land.
    To repose: keep #pepe-head and #pepe-body, redraw #pepe-arm-* and #pepe-legs.
  -->
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="eyeL"><path d="M100 78 C110 64 136 62 146 74 C138 88 110 90 100 78 Z"/></clipPath>
    <clipPath id="eyeR"><path d="M156 74 C166 60 194 58 204 70 C196 84 166 86 156 74 Z"/></clipPath>
  </defs>

  <g filter="url(#wobble)" stroke="#1d2711" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- legs: thick, short, splayed frog feet (drawn behind the body) -->
    <g id="pepe-legs">
      <!-- left leg: thick, short, splayed frog foot -->
      <path fill="#7fa23a" d="
        M84 360 C78 392 82 420 92 440
        L72 452 L86 452 L80 462 L98 456 L104 464 L112 452 L126 456
        C122 440 128 412 136 384 Z"/>
      <!-- right leg: stepping forward a little -->
      <path fill="#7fa23a" d="
        M164 384 C168 410 176 430 188 444
        L178 458 L194 454 L196 466 L208 454 L220 462 L222 448 L234 446
        C220 434 214 404 218 362 Z"/>
    </g>

    <!-- body: tall pear, heavy belly -->
    <g id="pepe-body">
      <!-- ===== body: tall pear, big belly ===== -->
      <path fill="#7fa23a" d="
        M100 128
        C84 136 72 152 68 176
        C56 210 50 250 54 290
        C58 340 82 386 150 388
        C214 390 246 344 248 292
        C252 248 244 206 232 176
        C226 152 214 136 200 128 Z"/>
      <!-- belly underline and navel crease -->
      <path d="M84 312 C100 352 200 356 222 312" stroke="#3f5719" stroke-width="2"/>
      <path d="M146 318 C150 322 154 322 156 318" stroke="#3f5719" stroke-width="1.8"/>
      <!-- chest / armpit creases -->
      <path d="M92 176 C100 186 104 196 104 206" stroke="#3f5719" stroke-width="1.8"/>
      <path d="M208 176 C200 186 196 196 196 206" stroke="#3f5719" stroke-width="1.8"/>
      <!-- leg crease where thigh meets belly -->
      <path d="M150 372 L150 388" stroke="#3f5719" stroke-width="1.8"/>
    </g>

    <!-- left arm: hanging, long fingers -->
    <g id="pepe-arm-l">
      <path fill="#7fa23a" d="
        M98 168 C74 172 58 214 54 270 C53 274 52 278 52 280
        C50 300 48 316 44 330
        L40 344 L48 340 L50 352 L56 342 L62 350 L64 336
        C66 320 68 300 70 280
        C72 240 82 212 100 198 C108 188 106 172 98 168 Z"/>
    </g>

    <!-- right arm: hanging, long fingers -->
    <g id="pepe-arm-r">
      <path fill="#7fa23a" d="
        M202 168 C226 172 242 214 246 270 C247 274 248 278 248 280
        C250 300 252 316 256 330
        L260 344 L252 340 L250 352 L244 342 L238 350 L236 336
        C234 320 232 300 230 280
        C228 240 218 212 200 198 C192 188 194 172 202 168 Z"/>
    </g>

    <!-- head: small, two eye bumps, heavy lids, smug smirk -->
    <g id="pepe-head">
      <!-- ===== head: small, two eye bumps on top ===== -->
      <path fill="#7fa23a" d="
        M86 120
        C78 104 80 84 92 70
        C94 50 124 40 146 54
        C160 40 196 42 210 66
        C222 82 222 104 214 120
        C204 140 176 148 150 148
        C122 148 96 140 86 120 Z"/>
      <!-- side-of-head ear ridge -->
      <path d="M86 92 C80 96 80 104 86 108" stroke="#3f5719" stroke-width="1.8"/>

      <!-- brow creases -->
      <path d="M102 62 C114 54 132 54 142 60" stroke="#3f5719" stroke-width="1.8"/>
      <path d="M160 58 C172 50 190 50 200 56" stroke="#3f5719" stroke-width="1.8"/>

      <!-- eye whites -->
      <path fill="#fff" d="M100 78 C110 64 136 62 146 74 C138 88 110 90 100 78 Z"/>
      <path fill="#fff" d="M156 74 C166 60 194 58 204 70 C196 84 166 86 156 74 Z"/>
      <!-- pupils + highlights -->
      <g clip-path="url(#eyeL)" stroke="none">
        <circle cx="126" cy="78" r="8.5" fill="#111"/>
        <circle cx="123" cy="74.5" r="2.6" fill="#fff"/>
        <circle cx="129" cy="81" r="1.2" fill="#fff"/>
      </g>
      <g clip-path="url(#eyeR)" stroke="none">
        <circle cx="184" cy="74" r="8.5" fill="#111"/>
        <circle cx="181" cy="70.5" r="2.6" fill="#fff"/>
        <circle cx="187" cy="77" r="1.2" fill="#fff"/>
      </g>
      <!-- heavy droopy lids -->
      <g clip-path="url(#eyeL)">
        <path fill="#7fa23a" stroke="none" d="M94 56 L152 56 L152 72 C138 66 114 66 94 74 Z"/>
      </g>
      <g clip-path="url(#eyeR)">
        <path fill="#7fa23a" stroke="none" d="M150 52 L210 52 L210 68 C196 62 172 62 150 70 Z"/>
      </g>
      <path d="M96 75 C112 66 136 64 150 71" stroke-width="2.6"/>
      <path d="M152 71 C168 62 194 60 208 67" stroke-width="2.6"/>
      <path d="M100 78 C110 64 136 62 146 74 C138 88 110 90 100 78 Z" stroke-width="2"/>
      <path d="M156 74 C166 60 194 58 204 70 C196 84 166 86 156 74 Z" stroke-width="2"/>
      <!-- under-eye bags -->
      <path d="M106 90 C118 96 136 95 144 88" stroke="#3f5719" stroke-width="1.6"/>
      <path d="M162 86 C174 92 192 91 200 84" stroke="#3f5719" stroke-width="1.6"/>

      <!-- lips: wide, thin, smug smirk (right corner pulled higher) -->
      <path fill="#c26a3d" d="
        M94 110
        C114 120 166 122 210 102
        C214 100 218 103 215 107
        C196 128 168 136 136 134
        C114 132 98 124 92 116
        C90 112 91 109 94 110 Z"/>
      <path d="M96 113 C122 126 172 126 212 105" stroke-width="2"/>
      <!-- smirk dimple at the high corner -->
      <path d="M209 97 C215 99 217 104 215 110" stroke="#3f5719" stroke-width="1.6"/>
    </g>
  </g>
</svg>
